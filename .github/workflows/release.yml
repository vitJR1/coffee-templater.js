name: Release

# Runs when a version tag is pushed:
#   npm version patch      # bumps package.json and creates tag v0.1.1
#   git push --follow-tags
#
# 1. Tests and builds the package.
# 2. Creates (or updates) the GitHub Release with the packed .tgz attached.
# 3. Publishes to npm — only if the repository secret NPM_TOKEN is set (npm "Automation" or granular
#    token with publish rights); otherwise the step is skipped with a notice. To publish an existing
#    tag later, add the secret and re-run this workflow for the tag.
# Tags with a pre-release suffix (v1.0.0-beta.1) are published under the `next` dist-tag.

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check the engine is pinned to a fixed release
        run: |
          node -e '
            const e = require("./package.json").coffeeEngine
            const tag = e.release ?? `v${e.version}`
            if (!/^v\d/.test(tag) || !e.sha256) {
              console.error(`::error::coffeeEngine must point to a version release (v*) with a sha256; got release "${tag}", sha256 ${e.sha256}`)
              process.exit(1)
            }'

      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - run: npm ci          # also builds dist via the `prepare` script
      - run: npm run typecheck
      - run: npm test

      - name: Pack
        id: pack
        run: echo "file=$(npm pack --ignore-scripts --silent)" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="${{ steps.pack.outputs.file }}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$FILE" --clobber
          else
            PRERELEASE=""
            case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" "$FILE" \
              --title "$GITHUB_REF_NAME" --generate-notes $PRERELEASE
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN secret is not set — skipping npm publish"
            exit 0
          fi
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION is already on npm — skipping"
            exit 0
          fi
          ARGS="--access public --provenance"
          case "$GITHUB_REF_NAME" in *-*) ARGS="$ARGS --tag next" ;; esac
          npm publish $ARGS
