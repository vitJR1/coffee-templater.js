name: Release

# Publishes to npm when a version tag is pushed:
#   npm version patch      # bumps package.json and creates tag v0.1.1
#   git push --follow-tags
#
# Requires the repository secret NPM_TOKEN (npm "Automation" or granular token with publish rights).
# Tags with a pre-release suffix (v1.0.0-beta.1) are published under the `next` dist-tag.

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Check the engine is pinned to a fixed release
        run: |
          node -e '
            const e = require("./package.json").coffeeEngine
            const tag = e.release ?? `v${e.version}`
            if (!/^v\d/.test(tag) || !e.sha256) {
              console.error(`::error::coffeeEngine must point to a version release (v*) with a sha256 to publish; got release "${tag}", sha256 ${e.sha256}`)
              process.exit(1)
            }'

      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set"
            exit 1
          fi
          ARGS="--access public"
          case "$GITHUB_REF_NAME" in *-*) ARGS="$ARGS --tag next" ;; esac
          # provenance needs a `repository` field in package.json pointing to this GitHub repo
          if node -e "process.exit(require('./package.json').repository ? 0 : 1)"; then
            ARGS="$ARGS --provenance"
          fi
          npm publish $ARGS

      - name: Pack for GitHub Release
        id: pack
        run: echo "file=$(npm pack --silent)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "${{ steps.pack.outputs.file }}" \
            --title "$GITHUB_REF_NAME" --generate-notes $PRERELEASE
