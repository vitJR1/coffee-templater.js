name: Release

# Runs when a version tag is pushed:
#   npm version patch      # bumps package.json and creates tag v0.1.1
#   git push --follow-tags
#
# 1. Tests and builds the package.
# 2. Creates (or updates) the GitHub Release with the packed .tgz attached.
# 3. Stages the version on npm with `npm stage publish` using the repository secret NPM_STAGE_TOKEN
#    (granular token, "Read and write (stage only)"). A staged version is not public until a
#    maintainer approves it with 2FA:  npm stage list  →  npm stage approve <stage-id>
#    (or on npmjs.com). Without the secret the step is skipped with a notice.
# Tags with a pre-release suffix (v1.0.0-beta.1) are published under the `next` dist-tag.
#
# An existing tag can be released again from Actions → Release → Run workflow (input: the tag).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v0.1.1'
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check the engine is pinned to a fixed release
        run: |
          node -e '
            const e = require("./package.json").coffeeEngine
            const tag = e.release ?? `v${e.version}`
            if (!/^v\d/.test(tag) || !e.sha256) {
              console.error(`::error::coffeeEngine must point to a version release (v*) with a sha256; got release "${tag}", sha256 ${e.sha256}`)
              process.exit(1)
            }'

      - name: Check tag matches package.json version
        run: |
          V="${TAG#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$V" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      - run: npm ci          # also builds dist via the `prepare` script
      - run: npm run typecheck
      - run: npm test

      - name: Pack
        id: pack
        run: echo "file=$(npm pack --silent | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="${{ steps.pack.outputs.file }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            PRERELEASE=""
            case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac
            gh release create "$TAG" "$FILE" \
              --title "$TAG" --generate-notes $PRERELEASE
          fi

      - name: Stage on npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_STAGE_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_STAGE_TOKEN secret is not set — skipping npm"
            exit 0
          fi
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION is already on npm — skipping"
            exit 0
          fi
          npm install -g npm@latest   # `npm stage` needs npm >= 11.15
          ARGS="--access public --provenance"
          case "$TAG" in *-*) ARGS="$ARGS --tag next" ;; esac
          npm stage publish $ARGS
          echo "::notice::$NAME@$VERSION is staged. Approve it with 2FA: npm stage list $NAME, then npm stage approve <stage-id>"
          echo "Staged **$NAME@$VERSION** on npm — approve it: \`npm stage list $NAME\` → \`npm stage approve <stage-id>\`" >> "$GITHUB_STEP_SUMMARY"
